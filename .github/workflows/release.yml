# 推 v* 标签时：类型检查、测试、打包，把同一个包发到 npm 和公开的 releases 仓库（package.json 的 sandcastle.releases）。
# 需要：
#   仓库 secret RELEASES_TOKEN：对 releases 仓库有 Contents 读写权限的 fine-grained token
#   npm 上这个包配好 Trusted Publisher（GitHub Actions，本仓库，workflow 文件 release.yml），走 OIDC，不用 npm token
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing 用 OIDC 换发布凭据

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: secret 已设置
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: test -n "$RELEASES_TOKEN" || { echo "RELEASES_TOKEN 是空的：pbpaste | gh secret set RELEASES_TOKEN"; exit 1; }
      - run: npm ci
      - name: 标签和 package.json 的版本一致
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - name: 打包
        run: |
          npm pack
          name=$(node -p 'require("./package.json").name')
          mv "$name"-*.tgz "$name".tgz
      - name: 发布说明取 CHANGELOG.md 里这个版本的一节
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md 里没有 ## $v"; exit 1; }
      - name: 发到 releases 仓库
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          repo=$(node -p 'require("./package.json").sandcastle.releases')
          # 重跑时已经发过就跳过（另一步失败后 rerun）
          if gh release view "$GITHUB_REF_NAME" --repo "$repo" > /dev/null 2>&1; then echo "已发过"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" "$(node -p 'require("./package.json").name').tgz" \
            --repo "$repo" --title "$GITHUB_REF_NAME" --notes-file notes.md
      - name: 把 README 和文档同步到 releases 仓库（源码仓库私有，npm 页面上的相对链接按 package.json 的 repository 指到这里）
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          repo=$(node -p 'require("./package.json").sandcastle.releases')
          git clone -q --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$repo.git" releases-repo
          mkdir -p releases-repo/docs
          cp README.md README.zh-CN.md CHANGELOG.md releases-repo/
          cp docs/config.md docs/config.zh-CN.md docs/onboarding-checklist.md docs/onboarding-checklist.zh-CN.md releases-repo/docs/
          cd releases-repo
          git add -A
          if git diff --cached --quiet; then echo "文档没变"; exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "docs: $GITHUB_REF_NAME"
          git push -q
      - name: 发到 npm（Trusted Publishing 要 npm ≥ 11.5.1，Node 22 自带的是 10）
        run: |
          name=$(node -p 'require("./package.json").name')
          v="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "$name@$v" version 2>/dev/null)" = "$v" ]; then echo "已发过"; exit 0; fi
          npm install -g npm@latest
          # 源码仓库公开时 npm 会自动生成 provenance，并要求 repository.url 指向源码仓库；
          # repository 有意指向 releases 仓库（源码仓库可能改回私有），所以关掉 provenance
          npm publish "$name.tgz" --access public --provenance=false
